<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Form Edit Produk</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/editproduk"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Form Edit Produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    <ion-item>
      <ion-img *ngIf="produks.url" [src]="produks.url" ></ion-img>
      <ion-img *ngIf="!produks.url" [src]="defaultImageUrl"></ion-img>
      <ion-button size="large" fill="clear">
          <ion-icon slot="icon-only" name="pencil"></ion-icon>
      </ion-button>
    </ion-item>

    <ion-item>
      {{ produks.name }}
      <ion-button size="default" fill="clear">
          <ion-icon slot="icon-only" name="pencil"></ion-icon>
      </ion-button>
    </ion-item>

    <ion-item>
      {{ produks.description }}
      <ion-button size="default" fill="clear">
          <ion-icon slot="icon-only" name="pencil"></ion-icon>
      </ion-button>
    </ion-item>

    <ion-item>
      Harga Beli : {{ produks.hargabeli }}
      <ion-button size="default" fill="clear">
          <ion-icon slot="icon-only" name="pencil"></ion-icon>
      </ion-button>
    </ion-item>

    <ion-item>
      Harga Jual : {{ produks.hargajual }}
      <ion-button size="default" fill="clear">
          <ion-icon slot="icon-only" name="pencil"></ion-icon>
      </ion-button>
    </ion-item>

    <ion-item>
      Stok : {{ produks.stok }}
      <ion-button size="default" fill="clear">
          <ion-icon slot="icon-only" name="pencil"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
