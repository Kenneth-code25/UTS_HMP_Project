<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>setting</ion-title>
        <ion-buttons slot="start">
    <ion-back-button defaultHref="/home"></ion-back-button>
</ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">setting</ion-title>
    </ion-toolbar>
  </ion-header>

<ion-list [inset]="true">
    
    <ion-item>
      <ion-icon name="moon-outline" slot="start"></ion-icon>
      <ion-label>Mode Gelap</ion-label>
      <ion-toggle [(ngModel)]="isDarkModeEnabled" (ionChange)="toggleDarkMode($event)"></ion-toggle>
    </ion-item>
  </ion-list>

</ion-content>
