<ion-app>
  <ion-router-outlet id="main-content"></ion-router-outlet>
  <ion-tabs>
    <ion-tab-bar slot="bottom">
      <ion-tab-button tab="home">
        <ion-icon name="home"></ion-icon>
        <ion-label>Home</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="about">
        <ion-icon name="help-circle-outline"></ion-icon>
        <ion-label>About</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="logout">
        <ion-icon name="log-out-outline"></ion-icon>
        <ion-label>Logout</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>

  <!-- drawer -->
  <ion-menu auto-hide="true" contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu List</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-list>
        <ion-item routerLink="/dashboard">
          <ion-icon name="home" slot="start"></ion-icon>
          <ion-label>Dashboard</ion-label>
        </ion-item>

        <ion-accordion-group>
          <ion-accordion value="produk">
            <ion-item slot="header">
              <ion-icon name="cube-outline" slot="start"></ion-icon>
              <ion-label>Produk</ion-label>
            </ion-item>
            <div slot="content">
              <ion-list>
                <ion-item routerLink="/tambah-produk" routerDirection="root" lines="none" style="padding-left: 20px;">
                  <ion-label>Tambah Produk</ion-label>
                </ion-item>
                <ion-item routerLink="/daftar-produk" routerDirection="root" lines="none" style="padding-left: 20px;">
                  <ion-label>Daftar Produk</ion-label>
                </ion-item>
              </ion-list>
            </div>
          </ion-accordion>
        </ion-accordion-group>

        <ion-item routerLink="/transaksi">
          <ion-icon name="receipt-outline" slot="start"></ion-icon>
          <ion-label>Transaksi</ion-label>
        </ion-item>
        <ion-item routerLink="/profile">
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-label>Profile</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-menu auto-hide="true" contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu List</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-list>
        <ion-item routerLink="/dashboard">
          <ion-icon name="home" slot="start"></ion-icon>
          <ion-label>Dashboard</ion-label>
        </ion-item>
        <ion-item routerLink="/produk">
          <ion-icon name="list" slot="start"></ion-icon>
          <ion-label>Produk</ion-label>
        </ion-item>
        <ion-item routerLink="/transaksi">
          <ion-icon name="receipt-outline" slot="start"></ion-icon>
          <ion-label>Transaksi</ion-label>
        </ion-item>
        <ion-item routerLink="/profile">
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-label>Profile</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>
</ion-app>
